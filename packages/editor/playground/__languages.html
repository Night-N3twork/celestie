<!doctype html>
<html lang="en">
	<head>
		<title>Language coverage verification</title>
		<style>
			body {
				background: #161820;
				color: #eee;
				font: 14px system-ui;
				margin: 20px;
			}
			button,
			select {
				padding: 8px;
				margin: 4px;
			}
			#editor {
				max-width: 1100px;
			}
			pre {
				white-space: pre-wrap;
			}
		</style>
	</head>
	<body>
		<h1>Bundled language coverage</h1>
		<select id="languages" aria-label="Language"></select
		><button type="button" id="load">Load sample</button
		><button type="button" id="readonly">Toggle read only</button
		><button type="button" id="inspect">Inspect</button
		><button type="button" id="dispose">Dispose</button>
		<div id="editor"></div>
		<pre id="result"></pre>
		<script type="module">
			import { getLanguages } from "../src/api/languages.ts";
			import { TextModel } from "../src/model/text-model.ts";
			import { EditorView } from "../src/view/editor-view.ts";
			import { samples } from "./__language-samples.mjs";
			const select = document.querySelector("#languages"),
				result = document.querySelector("#result");
			let view, model;
			for (const language of getLanguages()) {
				const option = document.createElement("option");
				option.value = language.id;
				option.textContent = language.name ?? language.id;
				select.append(option);
			}
			function inspect() {
				result.textContent = JSON.stringify(
					{
						mode: model?.getLanguageId(),
						text: model?.getValue(),
						selection: view?.getSelection(),
						diagnostics: view?.getDiagnostics(),
						tokens: document.querySelectorAll(
							'[class*="editor-token-"]',
						).length,
						modes: select.options.length,
						readOnly: view?.getOptions().readOnly,
					},
					null,
					2,
				);
			}
			function load() {
				view?.dispose();
				model?.dispose();
				const language = select.value;
				model = new TextModel(samples[language], {
					uri: "inmemory://verify/sample." + language,
					languageId: language,
				});
				view = new EditorView(document.querySelector("#editor"), model);
				view.focus();
				inspect();
			}
			select.value = "rust";
			document.querySelector("#load").onclick = load;
			document.querySelector("#inspect").onclick = inspect;
			document.querySelector("#readonly").onclick = () => {
				view.updateOptions({ readOnly: !view.getOptions().readOnly });
				view.focus();
				inspect();
			};
			document.querySelector("#dispose").onclick = () => {
				view.dispose();
				model.dispose();
				result.textContent =
					"Disposed renderers: " +
					document.querySelectorAll(".editor-renderer").length;
			};
			window.addEventListener(
				"error",
				(e) => (result.textContent = "ERROR " + e.message),
			);
			window.addEventListener(
				"unhandledrejection",
				(e) => (result.textContent = "ERROR " + e.reason),
			);
			load();
		</script>
	</body>
</html>
