<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Editor</title>
		<style>
			body {
				margin: 0;
				padding: 24px;
				background: #181818;
				color: #d4d4d4;
				font-family: system-ui, sans-serif;
			}

			#editor {
				border: 1px solid #3c3c3c;
			}
			#second-editor {
				border: 1px solid #3c3c3c;
				min-width: 0;
			}
			#editor {
				min-width: 0;
			}
			.editor-panes {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
			}
			.editor-panes.has-second {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 8px;
			}
			.editor-settings label[hidden],
			#second-editor[hidden] {
				display: none;
			}
			@media (max-width: 800px) {
				.editor-panes.has-second {
					grid-template-columns: minmax(0, 1fr);
				}
			}

			.file-tab {
				margin: 0;
				padding: 12px 16px;
				font-size: 13px;
				font-weight: normal;
			}

			.file-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				border: 1px solid #3c3c3c;
				border-bottom: 0;
				background: #252526;
			}

			.editor-actions {
				flex-wrap: wrap;
				display: flex;
				gap: 8px;
				min-width: 0;
				margin: 0;
				padding: 6px 12px;
				border: 0;
			}

			.editor-actions button {
				border: 1px solid #555;
				border-radius: 3px;
				padding: 6px 10px;
				background: #333;
				color: #d4d4d4;
				font: inherit;
				font-size: 12px;
				cursor: pointer;
			}

			.editor-settings {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 16px;
				margin: 0;
				border: 1px solid #3c3c3c;
				border-bottom: 0;
				padding: 8px 12px;
				font-size: 12px;
			}
			.editor-settings label {
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			.editor-settings select {
				background: #252526;
				color: #ddd;
				border: 1px solid #666;
			}
		</style>
	</head>
	<body>
		<main>
			<header class="file-header">
				<h1 class="file-tab" id="file-title">example.ts</h1>
				<fieldset class="editor-actions" aria-label="Editor actions">
					<button
						type="button"
						id="commands"
						title="Show commands (F1 or Ctrl/Cmd+Shift+P)"
					>
						Commands
					</button>
					<button type="button" id="indent">Indent</button>
					<button type="button" id="outdent">Outdent</button>
					<button
						type="button"
						id="line-comment"
						title="Toggle line comment (Ctrl/Cmd+/)"
					>
						Comment
					</button>
					<button
						type="button"
						id="block-comment"
						title="Toggle block comment (Shift+Alt+A)"
					>
						Block comment
					</button>
					<button type="button" id="find" title="Find (Ctrl/Cmd+F)">
						Find
					</button>
					<button
						type="button"
						id="go-to"
						title="Go to Line (Ctrl+G)"
					>
						Go to Line
					</button>
				</fieldset>
			</header>
			<fieldset class="editor-settings" aria-label="Editor settings">
				<label
					>Document
					<select id="document" aria-label="Document"></select></label
				>
				<label
					><input type="checkbox" id="second-view" />Second
					view</label
				>
				<label hidden
					>Second document
					<select
						id="second-document"
						aria-label="Second document"
					></select></label
				>
				<label
					>Line endings
					<select id="line-endings" aria-label="Line endings">
						<option value="LF">LF</option>
						<option value="CRLF">CRLF</option>
						<option value="CR">CR</option>
					</select></label
				>
				<label
					>Language
					<select id="language" aria-label="Language">
						<option value="plaintext">Plain text</option>
						<option value="typescript">TypeScript</option>
						<option value="javascript">JavaScript</option>
						<option value="json">JSON</option>
						<option value="jsonc">JSON with comments</option>
					</select></label
				>
				<span id="document-status" role="status"></span>
				<label
					>Tab size
					<select id="tab-size" aria-label="Tab size"></select></label
				>
				<label
					><input type="checkbox" id="insert-spaces" />Insert
					spaces</label
				>
				<label><input type="checkbox" id="read-only" />Read-only</label>
				<label
					><input type="checkbox" id="tab-focus" />Tab moves
					focus</label
				>
			</fieldset>
			<div class="editor-panes" id="editor-panes">
				<div id="editor"></div>
				<div id="second-editor" hidden></div>
			</div>
		</main>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
